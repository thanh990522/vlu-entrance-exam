name: Validate static site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check tests.js
          node --check theory.js
          node --check app.js
      - name: Verify required site files
        run: |
          test -s index.html
          test -s styles.css
          test -s tests.js
          test -s theory.js
          test -s app.js
