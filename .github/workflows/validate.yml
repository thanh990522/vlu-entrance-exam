name: Validate static site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check tests.js
          node --check theory.js
          node --check app.js
          node --check review-app.js
          node --check review-listening.js
          node --check explanation-runtime.js
          node --check listening-direct.js
          for f in vg-*.js reading-*.js vg-explanations-*.js; do node --check "$f"; done
      - name: Verify review source data and explanations
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window=global;
          const load=f=>vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          ['vg-init.js','vg-mcq-1.js','vg-mcq-2.js','vg-mcq-3.js','vg-mcq-4.js','vg-mcq-5.js','vg-mcq-6.js','vg-mcq-7.js','vg-mcq-8.js','vg-cloze-1.js','vg-cloze-2.js','vg-cloze-3.js'].forEach(load);
          ['reading-init.js','reading-1.js','reading-2.js','reading-3.js'].forEach(load);
          load('review-listening.js');
          ['vg-explanations-1.js','vg-explanations-2.js','vg-explanations-3.js','vg-explanations-4.js'].forEach(load);
          if(VG_REVIEW.mcq.length!==200) throw new Error(`Expected 200 Grammar/Vocabulary questions, got ${VG_REVIEW.mcq.length}`);
          if(VG_REVIEW.cloze.length!==5) throw new Error(`Expected 5 Cloze texts, got ${VG_REVIEW.cloze.length}`);
          if(READING_REVIEW.length!==6 || READING_REVIEW.some(x=>x.questions.length!==5)) throw new Error('Reading source count mismatch');
          if(LISTENING_REVIEW.length!==8 || LISTENING_REVIEW.some(x=>x.part1.length!==7 || x.part3.length!==6)) throw new Error('Listening source count mismatch');
          if(Object.keys(VG_EXPLANATIONS||{}).length!==200) throw new Error(`Expected 200 individual Grammar/Vocabulary explanations, got ${Object.keys(VG_EXPLANATIONS||{}).length}`);
          for(const q of VG_REVIEW.mcq){if(!VG_EXPLANATIONS[String(q.id)]) throw new Error(`Missing explanation for Grammar/Vocabulary question ${q.id}`);}
          console.log('Source and explanation counts OK:',VG_REVIEW.mcq.length,Object.keys(VG_EXPLANATIONS).length,VG_REVIEW.cloze.length,READING_REVIEW.length,LISTENING_REVIEW.length);
          NODE
      - name: Verify direct listening audio
        shell: bash
        run: |
          set -euo pipefail
          test -d audio/listening
          test "$(find audio/listening -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 16
          test "$(find audio/listening -maxdepth 1 -type f -name '*.mp3' -size +100k | wc -l)" -eq 16
          tracks=(
            'Track 01 TEST 1 Part 1.mp3' 'Track 03 TEST 1 Part 3.mp3'
            'Track 09 TEST 2 Part 1.mp3' 'Track 11 TEST 2 Part 3.mp3'
            'Track 17 TEST 3 Part 1.mp3' 'Track 19 TEST 3 Part 3.mp3'
            'Track 25 TEST 4 Part 1.mp3' 'Track 27 TEST 4 Part 3.mp3'
            'Track 33 TEST 5 Part 1.mp3' 'Track 35 TEST 5 Part 3.mp3'
            'Track 41 TEST 6 Part 1.mp3' 'Track 43 TEST 6 Part 3.mp3'
            'Track 49 TEST 7 Part 1.mp3' 'Track 51 TEST 7 Part 3.mp3'
            'Track 57 TEST 8 Part 1.mp3' 'Track 59 TEST 8 Part 3.mp3'
          )
          for f in "${tracks[@]}"; do test -s "audio/listening/$f"; done
      - name: Verify required site files
        run: |
          test -s index.html
          test -s styles.css
          test -s review.css
          test -s tests.js
          test -s theory.js
          test -s app.js
          test -s review-app.js
          test -s explanation-runtime.js
          test -s listening-direct.js
          test -s vg-explanations-1.js
          test -s vg-explanations-2.js
          test -s vg-explanations-3.js
          test -s vg-explanations-4.js
