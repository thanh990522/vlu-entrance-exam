<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#c6281f">
<meta name="description" content="VLU Entrance Exam practice with vocabulary-grammar, reading, listening, theory review and source-matched tests.">
<title>VLU Entrance Exam Lab</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="review.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><div class="logo">VLU</div><div><h1>Entrance Exam Lab</h1><small>Ôn tập tiếng Anh đầu vào</small></div></div>
    </div>
    <div class="hero-body">
      <div><h2>Review kỹ.<br>Làm test chắc.</h2><p>Hệ thống ôn tập lý thuyết và luyện đề tiếng Anh đầu vào theo nguồn đã cung cấp.</p></div>
      <div class="illustration" aria-hidden="true"><div class="blob"></div><div class="book"></div><div class="pencil"></div><div class="spark s1">✨</div><div class="spark s2">📚</div><div class="spark s3">💡</div></div>
    </div>
  </div>
</header>
<main class="wrap">
  <nav class="mainnav" aria-label="Điều hướng chính">
    <button class="active" data-view="vg">🧩 Từ vựng - Ngữ pháp</button>
    <button data-view="reading">📖 Đọc hiểu</button>
    <button data-view="listening">🎧 Nghe hiểu</button>
    <button data-view="theory">📚 Theory Review</button>
    <button data-view="test1">📝 Test 1</button>
    <button data-view="test2">📝 Test 2</button>
  </nav>

  <section class="page active review-page" id="vgPage">
    <div class="section-head"><h3>Từ vựng - Ngữ pháp</h3></div>
    <div class="review-shell">
      <div class="review-tabs" id="vgTabs"></div>
      <div id="vgContent"></div>
    </div>
  </section>

  <section class="page review-page" id="readingReviewPage">
    <div class="section-head"><h3>Đọc hiểu</h3></div>
    <div class="review-shell">
      <div class="review-tabs" id="readingTabs"></div>
      <div id="readingReviewContent"></div>
    </div>
  </section>

  <section class="page review-page" id="listeningPage">
    <div class="section-head"><h3>Nghe hiểu</h3></div>
    <div class="review-shell">
      <div class="review-tabs" id="listeningTabs"></div>
      <div id="listeningContent"></div>
    </div>
  </section>

  <section class="page" id="theoryPage">
    <div class="section-head"><h3>Khung lý thuyết ôn tập</h3></div>
    <div class="theory-layout">
      <aside class="theorynav" id="theoryNav"></aside>
      <section class="theorycard">
        <div class="topic-head"><h4 id="topicTitle"></h4><span class="topic-badge" id="topicBadge"></span></div>
        <div class="subtabs"><button class="active" data-sub="theorySub">📖 Lý thuyết</button><button data-sub="practiceSub">🎯 Bài tập thực hành</button></div>
        <div class="subpanel active" id="theorySub"><div class="theorybox" id="theoryContent"></div></div>
        <div class="subpanel" id="practiceSub">
          <div class="practice-toolbar"><b id="practiceCount">30 câu trắc nghiệm</b><div class="progressline"><i id="practiceFill"></i></div><button class="smallbtn" id="checkPractice">Chấm bài</button><button class="smallbtn" id="resetPractice">Làm lại</button></div>
          <div id="practiceList"></div>
        </div>
      </section>
    </div>
  </section>

  <section class="page" id="testsPage">
    <div id="examArea">
      <div class="section-head"><h3 id="examTitle"></h3><button class="smallbtn" id="resetExam">↻ Làm lại bài</button></div>
      <div class="result" id="resultBox"></div>
      <div class="exam-shell">
        <aside class="sidecard">
          <div class="timer"><span>⏱ Thời gian</span><strong id="timerText">00:00</strong></div>
          <button class="smallbtn timer-reset" id="timerReset">Khởi động lại đồng hồ</button>
          <div class="palette" id="palette"></div>
        </aside>
        <section class="examcard">
          <div class="examtop"><div class="segments" id="sectionSegments"></div><button class="submit" id="submitExam">Nộp bài</button></div>
          <div id="questions"></div>
        </section>
      </div>
    </div>
  </section>
</main>
<script src="tests.js"></script>
<script src="theory.js"></script>
<script src="vg-init.js"></script>
<script src="vg-mcq-1.js"></script>
<script src="vg-mcq-2.js"></script>
<script src="vg-mcq-3.js"></script>
<script src="vg-mcq-4.js"></script>
<script src="vg-mcq-5.js"></script>
<script src="vg-mcq-6.js"></script>
<script src="vg-mcq-7.js"></script>
<script src="vg-mcq-8.js"></script>
<script src="vg-cloze-1.js"></script>
<script src="vg-cloze-2.js"></script>
<script src="vg-cloze-3.js"></script>
<script src="reading-init.js"></script>
<script src="reading-1.js"></script>
<script src="reading-2.js"></script>
<script src="reading-3.js"></script>
<script src="review-listening.js"></script>
<script src="app.js"></script>
<script src="review-app.js"></script>
</body>
</html>
